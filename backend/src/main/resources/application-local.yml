server:
  # 8080 e 8081 já estão ocupadas na máquina de desenvolvimento; PORT sobrescreve.
  port: ${PORT:8082}

spring:
  config:
    # Lê o .env da raiz do repositório (GOOGLE_CLIENT_ID etc.), se existir.
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:${MYSQL_PORT:3307}/travel_planner
    username: travel
    password: travel
  security:
    oauth2:
      client:
        registration:
          google:
            # Valores provisórios permitem subir só com o login dev; o login Google exige os reais.
            client-id: ${GOOGLE_CLIENT_ID:nao-configurado}
            client-secret: ${GOOGLE_CLIENT_SECRET:nao-configurado}
            # O Google volta direto para o backend; o cookie de sessão (localhost) vale para o Vite.
            redirect-uri: http://localhost:8082/login/oauth2/code/google

app:
  auth:
    # O frontend roda no Vite em dev.
    post-login-redirect: http://localhost:5173/
    login-error-redirect: http://localhost:5173/login?error

springdoc:
  api-docs:
    enabled: true
