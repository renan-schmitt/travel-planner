spring:
  application:
    name: travel-planner
  datasource:
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  session:
    jdbc:
      # As tabelas vêm da migration V3 (Flyway).
      initialize-schema: never
  security:
    oauth2:
      client:
        registration:
          google:
            # Sem valor padrão: em produção a aplicação não sobe sem os segredos.
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,email,profile

server:
  port: ${PORT:8080}
  # Cloud Run fica atrás de um proxy HTTPS (necessário para os redirects do OAuth).
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30d
      cookie:
        http-only: true
        same-site: lax
        # Sobrevive ao fechamento do navegador (celular); `secure` fica no perfil prod.
        max-age: 30d

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  auth:
    post-login-redirect: /
    login-error-redirect: /login?error
    # E-mails separados por vírgula.
    admin-emails: ${APP_ADMIN_EMAILS:}
  places:
    # Chave restrita à "Places API (New)". Sem ela, a busca de cidades responde 503 e o usuário
    # digita a cidade à mão.
    api-key: ${PLACES_API_KEY:}
  suggestions:
    # Recalcula as sugestões das viagens não encerradas quando o backend sobe (em segundo plano):
    # cobre viagens criadas antes do motor e as regras que dependem da data até o job diário.
    reconcile-on-startup: ${APP_SUGGESTIONS_RECONCILE_ON_STARTUP:true}

# OpenAPI só nos perfis local e test.
springdoc:
  api-docs:
    enabled: false
  default-produces-media-type: application/json
